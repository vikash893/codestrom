services:
  mongodb:
    image: mongo:7.0
    container_name: mediresq-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: mediresq
    volumes:
      - mongodb_data:/data/db

  ai_services:
    build:
      context: ./ai_services
      dockerfile: Dockerfile
    container_name: mediresq-ai-services
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediresq-backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - ai_services
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/mediresq
      - JWT_SECRET=mediresq-production-secure-jwt-key-2026-xyz
      - AI_SERVICE_URL=http://ai_services:8000
      - EMERGENCY_DISPATCH_NUMBER=112

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mediresq-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
